name: skytrip
description: A flight booking app like Royal Jordanian
publish_to: 'none'
version: 1.2.1+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.2
  http: ^1.2.0
  http_parser: ^4.0.0
  url_launcher: ^6.3.0
  app_links: ^6.0.0
  file_picker: ^8.0.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.0
  shared_preferences: ^2.5.5
  local_auth: ^2.3.0
  intl: 0.20.2
  hive_flutter: ^1.1.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.14.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - lib/assets/cites_images/

   